model_reasoning_effort = "high"
web_search = "live"

[features]
apps = true
memories = true

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.git]
command = "uvx"
args = ["mcp-server-git"]

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]
