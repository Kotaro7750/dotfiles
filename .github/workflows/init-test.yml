name: Install dotfiles

on:
  push:
    branches:
      - master
    paths:
      - 'chezmoi/**'
      - 'chezmoi.example.yaml'
      - '.github/workflows/init-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: install (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - macos-15
        profile:
          - work
          - personal

    steps:
      - uses: actions/checkout@v6

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Configure test environment
        run: echo "TEST_HOME=$RUNNER_TEMP/dotfiles-home" >> "$GITHUB_ENV"

      - name: Prepare clean home
        run: |
          mkdir -p "$TEST_HOME"
          brew --version
          brew install chezmoi

      - name: Apply dotfiles
        run: |
          HOME="$TEST_HOME" chezmoi \
            --source "$GITHUB_WORKSPACE/chezmoi" \
            --destination "$TEST_HOME" \
            -c "$GITHUB_WORKSPACE/chezmoi.example.yaml" \
            --override-data '{"profile":"${{ matrix.profile }}"}' \
            --no-tty \
            apply

      - name: Install mise tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          HOME="$TEST_HOME" mise install -C "$TEST_HOME"

      - name: Verify installation
        run: |
          HOME="$TEST_HOME" chezmoi \
            --source "$GITHUB_WORKSPACE/chezmoi" \
            --destination "$TEST_HOME" \
            -c "$GITHUB_WORKSPACE/chezmoi.example.yaml" \
            --override-data '{"profile":"${{ matrix.profile }}"}' \
            --no-tty \
            apply

          HOME="$TEST_HOME" chezmoi \
            --source "$GITHUB_WORKSPACE/chezmoi" \
            --destination "$TEST_HOME" \
            -c "$GITHUB_WORKSPACE/chezmoi.example.yaml" \
            --override-data '{"profile":"${{ matrix.profile }}"}' \
            verify

          zsh -n "$TEST_HOME/.zshrc"
          HOME="$TEST_HOME" nvim --headless "+Lazy sync" +qa
